<!DOCTYPE html>
<html>
<head>
    <title>CURTAINS COMMAND CENTER</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e14; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #151a23; padding: 25px; border-radius: 20px; border: 1px solid #2d3446; width: 350px; text-align: center; }
        h2 { color: #5c9eff; margin-bottom: 20px; font-size: 1.2em; }
        .input-box { background: #0b0e14; border: 1px solid #2d3446; color: white; padding: 10px; border-radius: 10px; width: 90%; margin-bottom: 20px; text-align: center; font-size: 1em; box-sizing: border-box; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .box { background: #0b0e14; padding: 10px; border-radius: 12px; font-size: 0.6em; }
        .status-dot { height: 8px; width: 8px; background-color: #ff4d4d; border-radius: 50%; display: inline-block; transition: 0.3s; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #0b0e14; padding: 15px; border-radius: 15px; border: 1px solid #2d3446; }
        
        .relay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .relay-btn { background: #0b0e14; padding: 12px 5px; border-radius: 10px; font-size: 0.8em; border: 1px solid #2d3446; transition: 0.3s; font-weight: bold; }
        .active-relay { background: #ff4d4d; color: white; border-color: #ff4d4d; }
        
        .slider { -webkit-appearance: none; width: 100%; height: 10px; background: #0b0e14; border-radius: 10px; border: 1px solid #2d3446; margin: 20px 0; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: #5c9eff; border-radius: 50%; box-shadow: 0 0 15px rgba(92, 158, 255, 0.6); border: 3px solid #ffffff; transition: 0.2s; cursor: pointer; }
        .slider::-webkit-slider-thumb:hover { transform: scale(1.15); background: #84b8ff; }
        
        .settings-box { background: #0b0e14; padding: 15px; border-radius: 15px; border: 1px solid #2d3446; margin-bottom: 20px; text-align: left; }
        .settings-btn { background: #5c9eff; color: #151a23; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 40%; font-size: 0.7em; transition: 0.2s; }
        .settings-btn:active { transform: scale(0.95); }
        .reboot-btn { width: 100%; padding: 15px; background: #ff4d4d; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .reboot-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
<div class="card">
    <h2>CURTAINS CONTROL</h2>
    <input type="text" id="chipIdInput" class="input-box" placeholder="Enter Curtain Chip ID..." onchange="connectToDevice()">
    
    <div class="grid-3">
        <div class="box">CLOUD MQTT<br><span class="status-dot" id="mqttStatus"></span> <span id="mqttTxt">OFF</span></div>
        <div class="box">ESP HARDWARE<br><span class="status-dot" id="espStatus"></span> <span id="espTxt">OFF</span></div>
        <div class="box">NEXT RESTART<br><b id="rebootTimer" style="color:#5c9eff;">--:--:--</b></div>
    </div>
    
    <div class="grid-2">
        <div class="stat-card">TARGET POS<br><b style="font-size: 1.5em; color: #5c9eff;" id="targetDisplay">0</b></div>
        <div class="stat-card">CURRENT READ<br><b style="font-size: 1.5em; color: #2ecc71;" id="currentDisplay">0</b></div>
    </div>
    
    <div class="relay-grid">
        <div id="relayFwd" class="relay-btn">FWD (D5)</div>
        <div id="relayRev" class="relay-btn">REV (D6)</div>
    </div>
    
    <input type="range" class="slider" id="pulseSlider" min="0" max="100" oninput="updateTargetDisplay(this.value)" onchange="sendTarget(this.value)">
    
    <div class="settings-box">
        <div style="font-size: 0.7em; margin-bottom: 8px; color: #8892b0; font-weight: bold;">MAX PULSE LIMIT: <span id="maxDisplay" style="color: white;">100</span></div>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="newMaxInput" class="input-box" style="margin: 0; width: 60%; font-size: 0.9em; padding: 8px;" placeholder="New Limit...">
            <button class="settings-btn" onclick="sendNewMax()">SAVE PULSES</button>
        </div>
    </div>
    
    <button class="reboot-btn" onclick="sendReboot()">REBOOT SYSTEM</button>
</div>

<script>
    let client;
    const chipInput = document.getElementById("chipIdInput");
    let initialSyncDone = false; 

    // 1. Load saved ID on startup
    window.onload = () => {
        const savedId = localStorage.getItem("lastChipId");
        if (savedId) {
            chipInput.value = savedId;
            connectToDevice();
        }
    };

    function connectToDevice() {
        const chipId = chipInput.value;
        if(!chipId) return;
        
        // 2. Save ID for next time
        localStorage.setItem("lastChipId", chipId);
        initialSyncDone = false;
        
        if(client) client.disconnect();
        client = new Paho.MQTT.Client("93bad3def29641e399de9a7b9c676613.s1.eu.hivemq.cloud", 8884, "web_client_" + Math.random());
        
        client.connect({ userName: "tohits", password: "toh123@TOH", useSSL: true, onSuccess: () => {
            document.getElementById("mqttStatus").style.backgroundColor = "#2ecc71";
            document.getElementById("mqttTxt").innerText = "ON";
            client.subscribe("pulse/" + chipId + "/status");
        }});
        
        client.onMessageArrived = (m) => {
            document.getElementById("espStatus").style.backgroundColor = "#2ecc71";
            document.getElementById("espTxt").innerText = "ON";
            
            const d = m.payloadString.split(",");
            
            // Update Current display
            document.getElementById("currentDisplay").innerText = d[0];
            
            // Handle Restart Timer Display
            const timeRemaining = parseInt(d[3]);
            if (!isNaN(timeRemaining)) {
                const hours = Math.floor(timeRemaining / 3600);
                const minutes = Math.floor((timeRemaining % 3600) / 60);
                const seconds = timeRemaining % 60;
                document.getElementById("rebootTimer").innerText = 
                    (hours < 10 ? "0" : "") + hours + ":" + 
                    (minutes < 10 ? "0" : "") + minutes + ":" + 
                    (seconds < 10 ? "0" : "") + seconds;
            }

            // Update Max Pulse Readout
            const hwMax = parseInt(d[4]);
            if (!isNaN(hwMax)) {
                document.getElementById("pulseSlider").max = hwMax;
                document.getElementById("maxDisplay").innerText = hwMax;
            }

            // Sync the slider position to the current ESP position ONLY on first connect
            if (!initialSyncDone) {
                document.getElementById("pulseSlider").value = d[0];
                document.getElementById("targetDisplay").innerText = d[0];
                initialSyncDone = true;
            }

            // Update the 2 Relays (D5 and D6)
            const dir = parseInt(d[2]);
            document.getElementById("relayFwd").className = "relay-btn " + (dir === 1 ? "active-relay" : "");
            document.getElementById("relayRev").className = "relay-btn " + (dir === 2 ? "active-relay" : "");
        };
    }
    
    function updateTargetDisplay(val) { 
        const d = document.getElementById("targetDisplay"); 
        d.innerText = val; 
        d.style.color = "#ffffff"; 
        setTimeout(() => { d.style.color = "#5c9eff"; }, 500); 
    }
    
    function sendTarget(val) { 
        if(client && client.isConnected()) {
            let message = new Paho.MQTT.Message(val.toString());
            message.destinationName = "pulse/" + chipInput.value + "/set";
            client.send(message); 
        } else {
            alert("Not connected to MQTT broker!");
        }
    }
    
    function sendNewMax() {
        const newVal = document.getElementById("newMaxInput").value;
        const chipId = chipInput.value;
        if (newVal && client && client.isConnected()) {
            let message = new Paho.MQTT.Message("MAX:" + newVal);
            message.destinationName = "pulse/" + chipId + "/cmd";
            client.send(message);
            
            document.getElementById("newMaxInput").value = ""; 
            alert("New Pulse Limit Sent!");
        } else if (!client || !client.isConnected()) {
            alert("Not connected to MQTT broker!");
        }
    }
    
    function sendReboot() { 
        if(client && client.isConnected() && confirm("Confirm Reboot?")) {
            let message = new Paho.MQTT.Message("REBOOT");
            message.destinationName = "pulse/" + chipInput.value + "/cmd";
            client.send(message); 
        } else if (!client || !client.isConnected()) {
            alert("Not connected to MQTT broker!");
        }
    }
</script>
</body>
</html>
